[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scryfall-card-art-downloader"
version = "0.3.0"
description = "Download exact Magic: The Gathering card printings from Scryfall deck lists."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["Pillow>=11.0"]
authors = [{ name = "Jason Chao" }]
keywords = ["magic-the-gathering", "mtg", "scryfall"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
scryfall-download = "scryfall_art_downloader.cli:main"
scryfall-download-gui = "scryfall_art_downloader.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
